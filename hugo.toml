baseURL = "https://namespacekrvin.github.io/blog/"  # 部署后改成你的实际域名
languageCode = "zh-cn"
title = "我的博客"
theme = "PaperMod"

[pagination]
  pagerSize = 10                             # 每页文章数

[params]
  description = "这是我的个人博客"
  author = "Krvin"
  defaultTheme = "auto"                        # auto / light / dark
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true

  [params.homeInfoParams]
    Title = "👋 欢迎来到我的博客"
    Content = "这里记录我的学习笔记和技术思考"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/namespacekrvin"

[markup.highlight]
  style = "monokai"                            # 代码高亮主题
  lineNos = false
  guessSyntax = true

[outputs]
  home = ["HTML", "RSS", "JSON"]               # JSON 用于搜索功能